</style></head><body><main class="workspace"><section class="card configurator"><header class="page-header"><div class="header-title"><h1 class="brand">TELCORD</h1><p class="subtitle">Конфигуратор оптических патч-кордов</p></div><button type="button" class="production-load" id="productionLoad" aria-expanded="false" onclick="toggleProductionPopover(event)"><span class="production-dot" id="productionDot"></span><span id="productionLabel">Срок производства уточняется</span><span class="production-popover" role="tooltip"><strong id="productionTitle">Срок производства уточняется</strong><span id="productionMessage"></span></span></button></header><div class="config-section-head"><h2 class="config-section-title">Конфигурация</h2><button type="button" class="reset" onclick="resetAll()">↻ Сбросить</button></div><div id="controls" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section><aside class="card result-card"><h2 class="result-title">Ваша конфигурация</h2><div id="result" aria-live="polite"><div class="state">Цена рассчитывается…</div></div></aside><div class="mobile-bar" id="mobileBar" hidden><span class="mobile-price" id="mobilePrice"></span><button type="button" class="mobile-copy" onclick="copyConfiguration()">Скопировать</button></div></main><div class="toast" id="toast" role="status">Скопировано</div><script>
const productionStatusColors={NORMAL:'#2E9B61',MEDIUM:'#D28A18',HIGH:'#C93A32'};const EMPTY_CONFIG=Object.freeze({fiber_type:null,construction:null,jacket:null,color:null,connector_a:null,polish_a:null,holder_a:false,connector_b:null,polish_b:null,holder_b:false,length:'',corrugation:null,lead_a:null,lead_b:null,execution:'standard'});const initial=EMPTY_CONFIG;let config={...EMPTY_CONFIG},options=null,lastResult=null,requestNo=0;
const fiberUiColors={G652D:{code:'YL',color:'#E3C23B'},G655:{code:'YL',color:'#E3C23B'},G657A1:{code:'WH',color:'#FFFFFF',outline:'#7D8991'},G657A2:{code:'WH',color:'#FFFFFF',outline:'#7D8991'},G657B3:{code:'WH',color:'#FFFFFF',outline:'#7D8991'},OM1:{code:'GY',color:'#8A9196'},OM2:{code:'OR',color:'#D9822B'},OM3:{code:'AQ',color:'#38AFC2'},OM4:{code:'MA',color:'#B84C87'},OM5:{code:'LG',color:'#82B844'}};const constructionUiLabels={'2.0':'simplex','3.0':'simplex','2x1.8':'duplex','2x2.0':'duplex','2x3.0':'duplex','DUPLEX FLAT':'duplex flat','ARM-2x3.0':'duplex · арм.'};const labels={G652D:'G.652.D',G655:'G.655',G657A1:'G.657.A1',G657A2:'G.657.A2',G657B3:'G.657.B3',MTRJ_M:'MTRJ M',MTRJ_F:'MTRJ F',standard:'Стандарт',full_black:'Полностью чёрный','G16-PVC-GY':'Серая','G16-PVC-BK':'Чёрная'};const titles={MTRJ_M:'MTRJ Male',MTRJ_F:'MTRJ Female'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const local=v=>String(v).replace('.',',');const displayConstruction=v=>v==='DUPLEX FLAT'?'4×7':v.replace('ARM-','ARM ').replaceAll('x','×');
function group(label,key,values,formatter=v=>labels[v]||v){return `<div><span class="field-label">${label}</span><div class="choices">${values.map(v=>`<button type="button" class="choice ${config[key]===v?'active':''}" aria-pressed="${config[key]===v}" title="${esc(titles[v]||'')}" onclick='setValue(${JSON.stringify(key)},${JSON.stringify(v)})'>${esc(v===null?'Нет':formatter(v))}</button>`).join('')}</div></div>`}
function fiberStyle(value){const ui=fiberUiColors[value]||{color:'#8A9196'};return `--fiber-color:${ui.color};--fiber-outline:${ui.outline?`1px solid ${ui.outline}`:'1px solid transparent'}`}function fiberButtons(values){return `<div class="choices">${values.map(v=>`<button type="button" class="choice fiber-choice ${config.fiber_type===v?'active':''}" style="${fiberStyle(v)}" aria-pressed="${config.fiber_type===v}" onclick='setValue("fiber_type",${JSON.stringify(v)})'>${esc(labels[v]||v)}</button>`).join('')}</div>`}function fiberGroups(){const single=options.fiber_types.filter(v=>!v.startsWith('OM')),multi=options.fiber_types.filter(v=>v.startsWith('OM')),group=(title,values)=>values.length?`<div><span class="fiber-group-label">${title}</span>${fiberButtons(values)}</div>`:'';return `<span class="field-label">ВОЛОКНО</span><div class="fiber-groups">${group('Одномодовое',single)}${group('Многомодовое',multi)}</div>`}
function decimalTenths(value){const normalized=normalizeDecimal(value),parts=normalized.split('.'),whole=parseInt(parts[0]||'0',10),fraction=parseInt(((parts[1]||'')+'0').slice(0,1),10);return whole*10+(whole<0?-fraction:fraction)}function stepper(key,value,min,max,label,step){const current=decimalTenths(value),stepTenths=Math.round(step*10),minusDisabled=current-stepTenths<Math.round(min*10);return `<span class="stepper"><button type="button" class="step-button" aria-label="Уменьшить ${label} на ${local(step.toFixed(1))} м" ${minusDisabled?'disabled':''} onclick="adjustDecimal('${key}',-1,${min},${max},${step})">−</button><input aria-label="${label}, м" class="number-input" type="text" inputmode="decimal" value="${esc(local(value))}" onchange="setNumber('${key}',this.value)"><button type="button" class="step-button" aria-label="Увеличить ${label} на ${local(step.toFixed(1))} м" onclick="adjustDecimal('${key}',1,${min},${max},${step})">+</button></span>`}function constructionGroup(){const tooltip='2.0 и 3.0 — simplex. 2×2.0 и 2×3.0 — duplex. ARM — армированное исполнение.';return `<div><span class="field-label construction-label">КОНСТРУКЦИЯ <button type="button" class="info" aria-label="${tooltip}" data-tooltip="${tooltip}">ⓘ</button></span><div class="choices">${options.constructions.map(v=>`<button type="button" class="choice construction-choice ${config.construction===v?'active':''}" aria-pressed="${config.construction===v}" onclick='setValue("construction",${JSON.stringify(v)})'><span class="construction-main">${esc(displayConstruction(v))}</span><span class="construction-kind">${esc(constructionUiLabels[v]||'')}</span></button>`).join('')}</div></div>`}function connectorSide(side){const connector=config['connector_'+side],holder=['LC','SC'].includes(connector);return `<article class="connector-card"><h3 class="side-title">СТОРОНА ${side.toUpperCase()}</h3>${group('Разъём','connector_'+side,options.connectors)}<div style="margin-top:16px">${group('Полировка','polish_'+side,options.polishes)}</div>${holder?`<label class="holder" title="Объединяет два коннектора в duplex-пару."><input type="checkbox" ${config['holder_'+side]?'checked':''} onchange="toggleHolder('${side}')"><span class="switch"></span><span>Duplex-holder (dx)</span></label>`:''}</article>`}
function renderControls(){const lead=config.corrugation?`<div class="leads"><label><span class="field-label">ВЫВОД A</span><span class="lead-control">${stepper('lead_a',config.lead_a,0.1,5,'вывод A',0.1)}<span class="unit">м</span></span></label><label><span class="field-label">ВЫВОД B</span><span class="lead-control">${stepper('lead_b',config.lead_b,0.1,5,'вывод B',0.1)}<span class="unit">м</span></span></label><p class="hint" style="grid-column:1/-1">Вывод — длина шнура от края гофры до коннектора.</p></div>`:'';document.getElementById('controls').innerHTML=`<section class="section">${fiberGroups()}</section><section class="section construction-row"><div>${constructionGroup()}</div><div class="length-field"><label class="field-label" for="lengthInput">ДЛИНА</label><div class="length-entry"><input id="lengthInput" class="length-input" type="text" inputmode="decimal" value="${esc(local(config.length))}" oninput="setLengthInput(this.value)"><span class="unit">м</span></div><div class="quick-lengths">${[0.5,1,1.5,2,3,5,10,25,50].map(v=>`<button type="button" class="quick-length" onclick="setLengthPreset(${v})">${v}м</button>`).join('')}</div><p class="hint">Полная длина от коннектора до коннектора</p></div></section>${(options.jackets.length||options.colors.length)?`<section class="section"><h2 class="section-heading">Кабель</h2><div class="connector-grid">${options.jackets.length?group('ОБОЛОЧКА','jacket',options.jackets):'<div></div>'}${options.colors.length?group('ЦВЕТ','color',options.colors,v=>v):''}</div></section>`:''}<section class="section"><h2 class="section-heading">Разъёмы</h2><div class="connector-grid">${connectorSide('a')}${connectorSide('b')}</div></section><section class="section"><h2 class="section-heading">Гофра ПВХ Ø16</h2><div class="corrugation-row">${group('ГОФРА','corrugation',options.corrugations)}${lead}</div></section><section class="section">${group('ИСПОЛНЕНИЕ','execution',options.executions)}</section>`}
function summary(){const duplex=config.construction.includes('x'),holderA=config.holder_a?' duplex':'',holderB=config.holder_b?' duplex':'';const ca=(titles[config.connector_a]||config.connector_a)+'/'+config.polish_a+holderA,cb=(titles[config.connector_b]||config.connector_b)+'/'+config.polish_b+holderB;return `<div class="summary"><p class="summary-main">Шнур оптический ${duplex?'duplex':'simplex'}</p><p class="summary-connectors">${esc(ca)} → ${esc(cb)}</p><p class="summary-meta"><span class="fiber-dot" style="${fiberStyle(config.fiber_type)}" aria-hidden="true"></span>${esc(labels[config.fiber_type]||config.fiber_type)} · ${esc(displayConstruction(config.construction))} · ${esc(local(config.length))} м</p></div>`}
function loadingResult(){document.getElementById('result').innerHTML=summary()+`<div class="total-label">Итого</div><div class="skeleton"></div><p class="price-caption">Цена рассчитывается…</p>`}
function renderResult(x){lastResult=x;const bar=document.getElementById('mobileBar');if(!x.valid){const missing=(x.errors||[]).some(e=>e.includes('Цена компонента не задана'));document.getElementById('result').innerHTML=summary()+`<div class="state error" style="margin-top:20px"><b>${missing?'Для выбранной конфигурации цена пока не задана.':'Проверьте параметры.'}</b><ul>${(x.errors||[]).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;bar.hidden=true;return}const price=local(x.price.value);document.getElementById('result').innerHTML=summary()+`<div class="total-label">Итого</div><div class="price">${esc(price)} ₽</div><p class="price-caption">Цена для выбранной конфигурации</p><button type="button" class="primary" onclick="copyConfiguration()">Скопировать конфигурацию</button><div class="data-block"><div class="data-head"><span class="data-label">Артикул</span><button type="button" class="copy" aria-label="Скопировать артикул" onclick="copyText(lastResult.sku)">⧉ Копировать</button></div><p class="sku">${esc(x.sku)}</p></div><div class="data-block"><div class="data-head"><span class="data-label">Название</span><button type="button" class="copy" aria-label="Скопировать название" onclick="copyText(lastResult.name)">⧉ Копировать</button></div><p class="full-name">${esc(x.name)}</p></div><details class="breakdown"><summary>Расшифровка цены <span class="chevron">⌄</span></summary>${x.breakdown.map(v=>`<div class="price-line"><span class="price-line-name">${esc(v.component)}<span class="price-line-calc">${esc(local(v.qty))} ${esc(v.unit||'шт.')} × ${esc(local(v.calculation_price))} USD</span></span><span class="price-line-total">${esc(local(v.subtotal))} USD</span></div>`).join('')}</details>`;document.getElementById('mobilePrice').textContent=price+' ₽';bar.hidden=false}
async function refreshOptions(calculateAfter=true){try{const r=await fetch('/api/config/available-options',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});if(!r.ok)throw Error();options=await r.json();if(!options.fiber_types.includes(config.fiber_type))config.fiber_type=options.fiber_types[0]??null;if(!options.constructions.includes(config.construction))config.construction=options.constructions[0]??null;if(!options.jackets.includes(config.jacket))config.jacket=options.jackets[0]??null;if(!options.colors.includes(config.color))config.color=options.colors[0]??null;for(const s of['a','b'])if(!options.polishes.includes(config['polish_'+s]))config['polish_'+s]=options.polishes[0];renderControls();if(calculateAfter)calculate()}catch{document.getElementById('controls').innerHTML='<div class="state error">Не удалось загрузить параметры. Проверьте соединение с сервером.</div>'}}
async function calculate(){const id=++requestNo;loadingResult();try{const r=await fetch('/api/config/calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}),x=await r.json();if(id===requestNo)renderResult(x)}catch{if(id===requestNo)document.getElementById('result').innerHTML=summary()+'<div class="state error" style="margin-top:20px">Ошибка API. Повторите попытку.</div>'}}
async function loadProductionSettings(){try{const response=await fetch('/api/settings/public');if(!response.ok)throw Error();const data=await response.json();renderProductionSettings(data.production)}catch{renderProductionSettings(null)}}function renderProductionSettings(production){const label=document.getElementById('productionLabel'),dot=document.getElementById('productionDot'),title=document.getElementById('productionTitle'),message=document.getElementById('productionMessage');if(!production){label.textContent='Срок производства уточняется';title.textContent='Срок производства уточняется';message.textContent='';dot.style.background='#8c989f';return}const workdayWord=production.days_max%10>=2&&production.days_max%10<=4&&(production.days_max%100<12||production.days_max%100>14)?'дня':'дней';label.textContent=`Готовность ${production.days_min}–${production.days_max} рабочих ${workdayWord}`;title.textContent=production.title;message.textContent=production.message;dot.style.background=productionStatusColors[production.status]||'#8c989f'}function toggleProductionPopover(event){event.stopPropagation();if(event.target.closest('.production-popover'))return;const button=document.getElementById('productionLoad'),open=button.classList.toggle('open');button.setAttribute('aria-expanded',String(open))}document.addEventListener('click',()=>{const button=document.getElementById('productionLoad');button.classList.remove('open');button.setAttribute('aria-expanded','false')});function setValue(k,v){config[k]=v;if(k.startsWith('connector_')&&!['LC','SC'].includes(v))config['holder_'+k.slice(-1)]=false;if(k==='corrugation'){config.lead_a=v?(config.lead_a||'0.1'):null;config.lead_b=v?(config.lead_b||'0.1'):null}['fiber_type','construction','jacket','color','connector_a','connector_b'].includes(k)?refreshOptions():(renderControls(),calculate())}function normalizeDecimal(v){return String(v).trim().replace(',','.')}function validLength(v){return /^\d+(?:[.,]\d+)?$/.test(String(v).trim())&&Number(normalizeDecimal(v))>0}function setLengthInput(v){config.length=normalizeDecimal(v);const input=document.getElementById('lengthInput');if(!validLength(v)){input?.classList.add('invalid');lastResult=null;document.getElementById('mobileBar').hidden=true;document.getElementById('result').innerHTML=summary()+'<div class="state error" style="margin-top:20px">Введите корректную длину больше нуля.</div>';return}input?.classList.remove('invalid');calculate()}function setLengthPreset(v){config.length=String(v);renderControls();calculate()}function setNumber(k,v){config[k]=normalizeDecimal(v);renderControls();calculate()}function adjustDecimal(k,direction,min,max,step){const tenths=decimalTenths(config[k]||min),delta=Math.round(step*10)*direction,next=Math.max(Math.round(min*10),Math.min(Math.round(max*10),tenths+delta));config[k]=(next/10).toFixed(1);renderControls();calculate()}function toggleHolder(s){config['holder_'+s]=!config['holder_'+s];renderControls();calculate()}function resetAll(){config={...EMPTY_CONFIG};lastResult=null;requestNo++;document.getElementById('mobileBar').hidden=true;document.getElementById('result').innerHTML='<div class="state">Расчёт очищен. Измените параметры, чтобы выполнить новый расчёт.</div>';refreshOptions(false)}async function copyText(text){try{await navigator.clipboard.writeText(text);showToast()}catch{}}function copyConfiguration(){if(lastResult?.valid)copyText(lastResult.sku+'\n'+lastResult.name)}function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}loadProductionSettings();
</script><script>
config={...EMPTY_CONFIG};let emptyMode=true;
const KP_MARKUP_STORAGE_KEY='telcord-kp-markup',PRODUCTION_TERM_STORAGE_KEY='telcord-production-term',PRODUCTION_TERM_UPDATED_AT_STORAGE_KEY='telcord-production-term-updated-at';let kpMode=false;let markupPercent=localStorage.getItem(KP_MARKUP_STORAGE_KEY)||'0';let productionTerm=localStorage.getItem(PRODUCTION_TERM_STORAGE_KEY)||'2–3 рабочих дня';let productionTermUpdatedAt=localStorage.getItem(PRODUCTION_TERM_UPDATED_AT_STORAGE_KEY)||new Date().toISOString();
if(!localStorage.getItem(PRODUCTION_TERM_STORAGE_KEY))localStorage.setItem(PRODUCTION_TERM_STORAGE_KEY,productionTerm);if(!localStorage.getItem(PRODUCTION_TERM_UPDATED_AT_STORAGE_KEY))localStorage.setItem(PRODUCTION_TERM_UPDATED_AT_STORAGE_KEY,productionTermUpdatedAt);
const resultCard=document.querySelector('.result-card'),resultTitle=document.querySelector('.result-title'),resetButton=document.querySelector('.reset'),resultHeader=document.createElement('div'),resultHeading=document.createElement('div'),resultModeBadge=document.createElement('span'),resultHeaderActions=document.createElement('div');resultHeader.className='result-header';resultHeading.className='result-heading';resultModeBadge.className='kp-mode-badge';resultModeBadge.textContent='Режим КП для клиента';resultHeaderActions.className='result-header-actions';resultHeaderActions.innerHTML='<label class="kp-toggle"><span>КП</span><input type="checkbox" aria-label="Режим коммерческого предложения" onchange="toggleKpMode(this.checked)"><span class="switch"></span></label>';resultHeaderActions.append(resetButton);resultHeading.append(resultTitle,resultModeBadge);resultHeader.append(resultHeading,resultHeaderActions);resultCard.insertBefore(resultHeader,resultCard.firstChild);

function productionTermFreshness(timestamp=productionTermUpdatedAt){const updated=new Date(timestamp),now=new Date();if(Number.isNaN(updated.getTime()))return {text:'Срок требует проверки',level:'warning'};const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),updatedDay=new Date(updated.getFullYear(),updated.getMonth(),updated.getDate()),days=Math.max(0,Math.floor((today-updatedDay)/86400000));if(days===0)return {text:`Обновлено сегодня в ${updated.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`,level:'fresh'};if(days===1)return {text:'Обновлено вчера',level:'fresh'};if(days<=4)return {text:`Обновлено ${days} дня назад`,level:'caution'};return {text:`Срок требует проверки · обновлено ${days} дней назад`,level:'warning'}}

function loadSpecificationItems(){
 try{
  const stored=JSON.parse(localStorage.getItem(SPECIFICATION_STORAGE_KEY)||'[]');
  const items=Array.isArray(stored)?stored.filter(item=>item&&item.article&&Number.isInteger(item.quantity)&&item.quantity>=1).map(migrateSpecificationItem):[];
  const pricingModes=new Set(items.map(item=>item.pricingMode));
  if(pricingModes.size>1){localStorage.removeItem(SPECIFICATION_STORAGE_KEY);return []}
  if(items.length)kpMode=items[0].pricingMode==='kp';
  return items;
 }catch{return []}
}
function migrateSpecificationItem(item){const base=String(item.basePrice??item.price??'0');return {...item,pricingMode:item.pricingMode==='kp'?'kp':'base',basePrice:base,clientPrice:String(item.clientPrice??base),markupPercent:Number(item.markupPercent??0),price:String(item.price??base)}}
function saveSpecificationItems(){
 if(specificationItems.length)localStorage.setItem(SPECIFICATION_STORAGE_KEY,JSON.stringify(specificationItems));
 else localStorage.removeItem(SPECIFICATION_STORAGE_KEY);
}
function priceToCents(value){
 const normalized=String(value??'0').replace(',','.').trim(),parts=normalized.split('.');
 return (parseInt(parts[0]||'0',10)*100)+parseInt(((parts[1]||'')+'00').slice(0,2),10);
}
function formatRublesFromCents(cents){return `${Math.floor(cents/100).toLocaleString('ru-RU')},${String(Math.abs(cents)%100).padStart(2,'0')} ₽`}
function displayArticle(article){return String(article??'').replace(/^TELCORD\s+/i,'')}
function specificationItemUnitPrice(item){return item.pricingMode==='kp'?item.clientPrice:item.basePrice}
function specificationTotalCents(){return specificationItems.reduce((sum,item)=>sum+priceToCents(specificationItemUnitPrice(item))*item.quantity,0)}
function specificationDuplicateKey(item){return [item.article,item.pricingMode,item.basePrice,item.clientPrice,item.markupPercent].join('|')}
function specificationCopyText(){
 const rows=specificationItems.map((item,index)=>{const unit=priceToCents(specificationItemUnitPrice(item)),pricing=item.pricingMode==='kp'?`\nБазовая цена: ${formatRublesFromCents(priceToCents(item.basePrice))}\nНаценка: ${local(item.markupPercent)}%\nКлиентская цена: ${formatRublesFromCents(priceToCents(item.clientPrice))}`:'';return `${index+1}. TELCORD ${displayArticle(item.article)} ${item.productName}\nАртикул: ${displayArticle(item.article)}\nКоличество: ${item.quantity}${pricing}\nЦена: ${formatRublesFromCents(unit)} / шт.\nСумма: ${formatRublesFromCents(unit*item.quantity)}`});
 return `Спецификация TELCORD\n\n${rows.join('\n\n')}\n\nИтого: ${formatRublesFromCents(specificationTotalCents())}\n\nСрок изготовления: ${productionTerm} · ${productionTermFreshness().text.toLowerCase()}`;
}
function configurationCopyText(withPrice=false){
 if(!lastResult?.valid)return '';
 const base=`TELCORD ${displayArticle(lastResult.sku)} ${lastResult.name}`;
 const unit=kpMode?calculateClientCents(priceToCents(lastResult.price.value),normalizedMarkup()):priceToCents(lastResult.price.value);
 const term=`Срок изготовления: ${productionTerm} · ${productionTermFreshness().text.toLowerCase()}`;
 return withPrice?`${base}\nЦена: ${formatRublesFromCents(unit)}\n${term}`:`${base}\n${term}`;
}
async function copyCurrentConfiguration(withPrice=false,button=null){
 const text=configurationCopyText(withPrice);if(!text)return;
 if(await copyText(text))temporaryCopiedLabel(button);
}
function temporaryCopiedLabel(button,label='Скопировано'){
 if(!button)return;const previous=button.textContent;button.textContent=label;button.disabled=true;
 setTimeout(()=>{button.textContent=previous;button.disabled=false},1700);
}
function renderSpecification(){
 const root=document.getElementById('specification');if(!root)return;
 const copyAction=kpMode?'<button type="button" class="reset specification-copy-primary" onclick="copySpecificationForEmail(this)">Скопировать для письма</button>':'<button type="button" class="reset" onclick="copySpecification(this)">Скопировать</button>';
 const actions=specificationItems.length?`<div class="specification-head-actions">${copyAction}<button type="button" class="reset" onclick="clearSpecification()">Очистить</button></div>`:'';
 const modeNote=kpMode?`<span class="specification-mode-note">В копирование для письма попадут клиентские цены</span><span class="specification-term-note">Срок изготовления: ${esc(productionTerm||'не указан')}</span>`:'';
 const head=`<div class="specification-head"><div class="specification-heading"><h2 class="specification-title">${kpMode?'СПЕЦИФИКАЦИЯ · КП ДЛЯ КЛИЕНТА':'СПЕЦИФИКАЦИЯ'}</h2>${modeNote}</div>${actions}</div>`;
 if(!specificationItems.length){root.innerHTML=head+'<p class="specification-empty">Добавьте рассчитанную конфигурацию — она появится здесь</p>';return}
 const items=specificationItems.map((item,index)=>{const unit=priceToCents(specificationItemUnitPrice(item));return `<article class="specification-item"><span class="specification-number">${index+1}</span><div><p class="specification-name">${esc(item.productName)}${item.pricingMode==='kp'?'<span class="specification-mode">КП</span>':''}</p><p class="specification-sku">Артикул: ${esc(displayArticle(item.article))}</p><div class="specification-controls"><span class="quantity-control">Кол-во <button type="button" aria-label="Уменьшить количество" ${item.quantity<=1?'disabled':''} onclick="changeSpecificationQuantity('${esc(item.id)}',-1)">−</button><input class="quantity-input" type="number" min="1" step="1" inputmode="numeric" value="${item.quantity}" aria-label="Количество" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" onblur="commitSpecificationQuantity('${esc(item.id)}',this.value)"><button type="button" aria-label="Увеличить количество" onclick="changeSpecificationQuantity('${esc(item.id)}',1)">+</button></span><button type="button" class="specification-remove" aria-label="Удалить позицию" onclick="removeSpecificationItem('${esc(item.id)}')">×</button></div></div><div class="specification-price">${formatRublesFromCents(unit*item.quantity)}<span class="specification-unit-price">${formatRublesFromCents(unit)} / шт.</span></div></article>`}).join('');
 root.innerHTML=head+`<div class="specification-list">${items}</div><div class="specification-total"><span>Итого</span><span>${formatRublesFromCents(specificationTotalCents())}</span></div>`;
}
function addToSpecification(){
 if(!lastResult?.valid)return;
 if(specificationItems.some(item=>(item.pricingMode==='kp')!==kpMode)){specificationItems=[];saveSpecificationItems()}
 const baseCents=priceToCents(lastResult.price.value),clientCents=kpMode?calculateClientCents(baseCents,normalizedMarkup()):baseCents;
 const snapshot={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,configuration:JSON.parse(JSON.stringify(config)),fiber:config.fiber_type,construction:config.construction,jacket:config.jacket,color:config.color,length:config.length,connectorA:config.connector_a,polishA:config.polish_a,holderA:config.holder_a,connectorB:config.connector_b,polishB:config.polish_b,holderB:config.holder_b,conduit:config.corrugation,execution:config.execution,productName:lastResult.name,article:lastResult.sku,pricingMode:kpMode?'kp':'base',basePrice:(baseCents/100).toFixed(2),markupPercent:kpMode?normalizedMarkup():0,clientPrice:(clientCents/100).toFixed(2),price:(baseCents/100).toFixed(2),currency:lastResult.price.currency||'RUB',quantity:1,addedAt:new Date().toISOString()};
 const newItemKey=specificationDuplicateKey(snapshot),duplicate=specificationItems.find(item=>specificationDuplicateKey(item)===newItemKey);
 if(duplicate)duplicate.quantity+=1;
 else specificationItems.push(snapshot);
 saveSpecificationItems();renderSpecification();resetAll();
}
function repeatLastSpecificationItem(){
 const last=[...specificationItems].reverse().find(item=>item.configuration);
 if(!last)return;
 config={...EMPTY_CONFIG,...JSON.parse(JSON.stringify(last.configuration))};
 emptyMode=false;lastResult=null;requestNo++;
 renderLiveSummary();refreshOptions(true);
}
function changeSpecificationQuantity(id,delta){const item=specificationItems.find(value=>value.id===id);if(!item)return;item.quantity=Math.max(1,item.quantity+delta);saveSpecificationItems();renderSpecification()}
function commitSpecificationQuantity(id,value){const item=specificationItems.find(entry=>entry.id===id);if(!item)return;const parsed=Math.trunc(Number(value));item.quantity=Number.isFinite(parsed)&&parsed>=1?parsed:1;saveSpecificationItems();renderSpecification()}
function removeSpecificationItem(id){specificationItems=specificationItems.filter(item=>item.id!==id);saveSpecificationItems();renderSpecification()}
function clearSpecification(){specificationItems=[];saveSpecificationItems();renderSpecification()}
async function copySpecification(button){if(!specificationItems.length)return;if(await copyText(specificationCopyText()))temporaryCopiedLabel(button)}

function productionLeadTime(){return productionTerm.trim()||'Срок уточняется'}
function specificationFullProductName(item){return `TELCORD ${displayArticle(item.article)} ${item.productName}`}
function specificationEmailHtml(){
 const rows=specificationItems.map((item,index)=>{const unit=priceToCents(specificationItemUnitPrice(item));return `<tr><td style="padding:8px;border-bottom:1px solid #ddd;vertical-align:top">${index+1}. ${esc(specificationFullProductName(item))}</td><td style="padding:8px;border-bottom:1px solid #ddd;text-align:center;white-space:nowrap">${item.quantity} шт.</td><td style="padding:8px;border-bottom:1px solid #ddd;text-align:right;white-space:nowrap">${formatRublesFromCents(unit)}</td><td style="padding:8px;border-bottom:1px solid #ddd;text-align:right;white-space:nowrap">${formatRublesFromCents(unit*item.quantity)}</td></tr>`}).join('');
 return `<div style="font-family:Arial,sans-serif;font-size:13px;color:#222"><p style="font-size:16px;font-weight:bold;margin:0 0 12px">Коммерческое предложение</p><table style="border-collapse:collapse;width:100%;font-family:Arial,sans-serif;font-size:13px"><thead><tr><th style="padding:8px;border-bottom:2px solid #bbb;text-align:left">Наименование</th><th style="padding:8px;border-bottom:2px solid #bbb;text-align:center">Кол-во</th><th style="padding:8px;border-bottom:2px solid #bbb;text-align:right">Цена, ₽</th><th style="padding:8px;border-bottom:2px solid #bbb;text-align:right">Сумма, ₽</th></tr></thead><tbody>${rows}</tbody></table><p style="font-weight:bold;text-align:right;margin:14px 0 8px">Итого: ${formatRublesFromCents(specificationTotalCents())}</p><p style="margin:0">Срок изготовления: ${esc(productionLeadTime())}</p></div>`;
}
function specificationEmailText(){
 const rows=specificationItems.map((item,index)=>{const unit=priceToCents(specificationItemUnitPrice(item));return `${index+1}. ${specificationFullProductName(item)}\n   Количество: ${item.quantity}\n   Цена: ${formatRublesFromCents(unit)}\n   Сумма: ${formatRublesFromCents(unit*item.quantity)}`});
 return `Коммерческое предложение\n\n${rows.join('\n\n')}\n\nИтого: ${formatRublesFromCents(specificationTotalCents())}\n\nСрок изготовления: ${productionLeadTime()}`;
}
async function copySpecificationForEmail(button){
 if(!specificationItems.length)return;
 const html=specificationEmailHtml(),plain=specificationEmailText();let copied=false,rich=false;
 if(window.isSecureContext&&navigator.clipboard?.write&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);copied=true;rich=true}catch{}}
 if(!copied)copied=await copyText(plain);
 if(copied){const success=kpMode?'КП скопировано · клиентские цены':'Скопировано';const toast=document.getElementById('toast');toast.textContent=success;toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');toast.textContent='Скопировано'},1800);temporaryCopiedLabel(button,success)}
}

function legacyCopyText(text){
 const textarea=document.createElement('textarea');
 textarea.value=text;
 textarea.setAttribute('readonly','');
 textarea.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
 document.body.appendChild(textarea);
 textarea.focus();textarea.select();
 try{return document.execCommand('copy')}catch{return false}finally{textarea.remove()}
}
copyText=async function(text){
 let copied=false;
 if(window.isSecureContext&&navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);copied=true}catch{}}
 if(!copied)copied=legacyCopyText(text);
 const toast=document.getElementById('toast');
 toast.textContent=copied?'Скопировано':'Не удалось скопировать — выделите текст вручную';
 toast.classList.add('show');
 setTimeout(()=>{toast.classList.remove('show');toast.textContent='Скопировано'},1800);
 return copied;
};

const calculatedResultRenderer=renderResult;
renderResult=function(result){
 calculatedResultRenderer(result);
 if(!result.valid)return;
 const priceBlock=document.querySelector('.result-card .live-price-block');if(!priceBlock)return;
 const baseCents=priceToCents(result.price.value),clientCents=calculateClientCents(baseCents,normalizedMarkup()),priceMarkup=kpMode?`<div class="kp-price-details"><div class="kp-price-row"><span>Базовая цена</span><strong>${formatRublesFromCents(baseCents)}</strong></div><div class="kp-price-row"><span id="kpMarkupLabel">Наценка ${local(normalizedMarkup())}%</span><strong id="kpMarkupAmount">${formatRublesFromCents(clientCents-baseCents)}</strong></div><div class="kp-price-row kp-client-total"><span>КЛИЕНТСКАЯ ЦЕНА</span><strong class="kp-client-price" id="kpClientPrice">${formatRublesFromCents(clientCents)}</strong></div></div>`:`<div class="price">${formatRublesFromCents(baseCents)}</div><p class="price-caption">Цена для выбранной конфигурации</p>`;
 priceBlock.innerHTML=priceMarkup+`<div class="summary-actions"><button type="button" class="copy-action" onclick="copyCurrentConfiguration(false,this)">Скопировать</button><button type="button" class="copy-action" onclick="copyCurrentConfiguration(true,this)">Скопировать с ценой</button></div><button type="button" class="primary add-specification" onclick="addToSpecification()">Добавить в спецификацию</button>`;
 document.getElementById('mobilePrice').textContent=formatRublesFromCents(kpMode?clientCents:baseCents);
};
copyConfiguration=function(){copyCurrentConfiguration(false)};
updateModeAppearance();
renderProductionTerm();
renderSpecification();
renderLiveSummary();
refreshOptions(false);
</script></body></html>
